{% load socialaccount %}  
<!DOCTYPE html>  
<html lang="en">  
<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>Login - Django OAuth App</title>  
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">  
    <style>  
        body {  
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);  
            min-height: 100vh;  
            display: flex;  
            align-items: center;  
        }  
        .login-card {  
            background: white;  
            border-radius: 15px;  
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);  
        }  
        .google-btn {  
            background-color: #4285f4;  
            color: white;  
            border: none;  
            padding: 12px;  
            font-size: 16px;  
            transition: background-color 0.3s;  
        }  
        .google-btn:hover {  
            background-color: #357ae8;  
            color: white;  
        }  
        .divider {  
            display: flex;  
            align-items: center;  
            text-align: center;  
            margin: 20px 0;  
        }  
        .divider::before,  
        .divider::after {  
            content: '';  
            flex: 1;  
            border-bottom: 1px solid #dee2e6;  
        }  
        .divider span {  
            padding: 0 10px;  
            color: #6c757d;  
            font-weight: 500;  
        }  
    </style>  
</head>  
<body>  
    <div class="container">  
        <div class="row justify-content-center">  
            <div class="col-md-5">  
                <div class="login-card p-5">  
                    <div class="text-center mb-4">  
                        <h2 class="fw-bold">Welcome Back</h2>  
                        <p class="text-muted">Login to continue to Django OAuth App</p>  
                    </div>  
  
                    <!-- Google Login Button -->  
                    <a href="{% provider_login_url 'google' %}" class="btn google-btn w-100 mb-3">  
                        <svg width="18" height="18" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" style="vertical-align: middle; margin-right: 8px;">  
                            <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/>  
                            <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/>  
                            <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/>  
                            <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/>  
                        </svg>  
                        Continue with Google  
                    </a>  
  
                    <div class="divider">  
                        <span>OR</span>  
                    </div>  
  
                    <!-- Regular Email/Password Login Form -->  
                    <form method="post" action="{% url 'account_login' %}">  
                        {% csrf_token %}  
                          
                        {% if form.errors %}  
                        <div class="alert alert-danger" role="alert">  
                            Invalid email or password. Please try again.  
                        </div>  
                        {% endif %}  
  
                        <div class="mb-3">  
                            <label for="id_login" class="form-label">Email Address</label>  
                            <input type="email"   
                                   name="login"   
                                   class="form-control"   
                                   id="id_login"   
                                   placeholder="your.email@example.com"  
                                   required>  
                        </div>  
  
                        <div class="mb-3">  
                            <label for="id_password" class="form-label">Password</label>  
                            <input type="password"   
                                   name="password"   
                                   class="form-control"   
                                   id="id_password"   
                                   placeholder="Enter your password"  
                                   required>  
                        </div>  
  
                        <div class="mb-3 form-check">  
                            <input type="checkbox"   
                                   name="remember"   
                                   class="form-check-input"   
                                   id="id_remember">  
                            <label class="form-check-label" for="id_remember">  
                                Remember me  
                            </label>  
                        </div>  
  
                        <button type="submit" class="btn btn-primary w-100">  
                            Login with Email  
                        </button>  
                    </form>  
  
                    <div class="text-center mt-4">  
                        <p class="text-muted mb-0">  
                            <small>Don't have an account? Contact administrator</small>  
                        </p>  
                    </div>  
                </div>  
  
                <div class="text-center mt-3">  
                    <a href="/" class="text-white text-decoration-none">  
                        <small>← Back to Home</small>  
                    </a>  
                </div>  
            </div>  
        </div>  
    </div>  
  
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>  
</body>  
</html>
